[project]
name = "fx-mos"
version = "0.1.0"
description = "Manufacturing Operating System core: production control, traceability, interlocking and OEE."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://fitexindustrial.com"

[project.scripts]
fx-mos-simulate = "fx_mos.simulator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
